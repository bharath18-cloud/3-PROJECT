<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sai Teja Traders | Premium Steel & Cement E-Commerce</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="Sai Teja Traders is your trusted B2B supply partner for high-quality Steel TMT Bars, Cement, Binding Wire, and construction materials. View live prices and order online.">
  
  <!-- Google Fonts: Outfit (Display) & Inter (Body) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              light: '#2d435e',
              DEFAULT: '#1F3147',
              dark: '#121e2d'
            },
            teal: {
              light: '#05aab5',
              DEFAULT: '#008C95',
              dark: '#006a71'
            },
            gold: {
              light: '#f5c645',
              DEFAULT: '#D4A017',
              dark: '#a87c0d'
            },
            lightBg: '#F8F8F8',
            glassBg: 'rgba(255, 255, 255, 0.85)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          boxShadow: {
            premium: '0 10px 30px -10px rgba(31, 49, 71, 0.1)',
            glow: '0 0 15px rgba(0, 140, 149, 0.25)',
            goldGlow: '0 0 15px rgba(212, 160, 23, 0.25)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8F8F8;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6, .font-display {
      font-family: 'Outfit', sans-serif;
    }
    /* Smooth Scroll */
    html {
      scroll-behavior: smooth;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F8F8F8;
    }
    ::-webkit-scrollbar-thumb {
      background: #1F3147;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #008C95;
    }
    
    /* Animation keyframes */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #008C95); }
    }
    .pulse-glow {
      animation: pulse-glow 2s infinite ease-in-out;
    }

    /* Print styling for GST invoices */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React JSX Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SEED DATA & INITIALIZATIONS ---
    const defaultProducts = [
      { id: 'p1', name: 'JSW NeoSteel TMT Rebars', category: 'Steel TMT Bars', brand: 'JSW', grade: 'Fe-550D', price: 54500, unit: 'Ton', stock: 120, lowStock: 25, spec: 'High ductility, earthquakes-resistant ribbed design, 8mm-32mm sizes.', image: 'steel-jsw' },
      { id: 'p2', name: 'Tata Tiscon 550SD', category: 'Steel TMT Bars', brand: 'Tata', grade: 'Fe-550SD', price: 56200, unit: 'Ton', stock: 85, lowStock: 20, spec: 'Super Ductile steel rebars, micro-alloyed, rust-resistant.', image: 'steel-tata' },
      { id: 'p3', name: 'UltraTech Premium OPC 53', category: 'Cement', brand: 'UltraTech', grade: 'Grade 53', price: 425, unit: 'Bag', stock: 1450, lowStock: 200, spec: 'Ordinary Portland Cement, high 28-day compressive strength, ideal for RCC.', image: 'cement-ultratech' },
      { id: 'p4', name: 'Dalmia Supreme PPC Cement', category: 'Cement', brand: 'Dalmia', grade: 'PPC', price: 385, unit: 'Bag', stock: 950, lowStock: 150, spec: 'Portland Pozzolana Cement, crack-resistant, low heat of hydration, wet environments.', image: 'cement-dalmia' },
      { id: 'p5', name: 'Tata Wiron Gi Binding Wire', category: 'Binding Wire', brand: 'Tata', grade: '18 Gauge', price: 7900, unit: 'Bundle', stock: 45, lowStock: 10, spec: 'Galvanized iron wire, highly flexible and sturdy for tying reinforcement bars.', image: 'wire-tata' },
      { id: 'p6', name: 'ACC Gold Water Shield', category: 'Cement', brand: 'ACC', grade: 'Grade 53', price: 445, unit: 'Bag', stock: 18, lowStock: 50, spec: 'Water-repellent premium cement with active water-shield formulas.', image: 'cement-acc' },
      { id: 'p7', name: 'Vizag Steel TMT Bars', category: 'Steel TMT Bars', brand: 'Vizag', grade: 'Fe-500D', price: 51900, unit: 'Ton', stock: 6, lowStock: 15, spec: 'RINL Vizag steel rebars, clean steel with low sulphur & phosphorus.', image: 'steel-vizag' },
      { id: 'p8', name: 'Standard Cover Blocks (Concrete)', category: 'Construction Materials', brand: 'Local', grade: '20/25/30mm', price: 350, unit: 'Box', stock: 120, lowStock: 30, spec: 'Concrete spacer blocks to ensure correct rebar reinforcement concrete cover.', image: 'materials-cover' }
    ];

    const defaultPricesHistory = [
      { category: 'Steel TMT Bars', currentPrice: 54500, previousPrice: 55000, lastUpdated: 'Today' },
      { category: 'Cement', currentPrice: 425, previousPrice: 420, lastUpdated: 'Today' },
      { category: 'Binding Wire', currentPrice: 7900, previousPrice: 7850, lastUpdated: 'Yesterday' }
    ];

    const defaultOrders = [
      {
        id: 'ORD-98721',
        customerName: 'Bharath Builders',
        customerMobile: '9876543210',
        customerGST: '36AAAAA1111A1Z1',
        deliveryAddress: 'Plot 42, Hitec City, Hyderabad, 500081',
        date: '2026-06-18',
        deliveryDate: '2026-06-21',
        items: [
          { productId: 'p1', name: 'JSW NeoSteel TMT Rebars', quantity: 2, price: 54500, unit: 'Ton' },
          { productId: 'p3', name: 'UltraTech Premium OPC 53', quantity: 100, price: 425, unit: 'Bag' }
        ],
        subtotal: 151500,
        gst: 27270,
        total: 178770,
        paymentMethod: 'Credit Account',
        paymentStatus: 'Paid',
        deliveryStatus: 'Processing',
        trackingHistory: [
          { status: 'Order Confirmed', time: '2026-06-18 10:30 AM', comment: 'Order placed and B2B credit check completed.' },
          { status: 'Processing', time: '2026-06-18 02:45 PM', comment: 'Inventory allocated at warehouse.' }
        ]
      }
    ];

    // --- MAIN REACT COMPONENT ---
    function App() {
      // LocalStorage state syncing
      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('st_products');
        return local ? JSON.parse(local) : defaultProducts;
      });

      const [pricesHistory, setPricesHistory] = useState(() => {
        const local = localStorage.getItem('st_prices_history');
        return local ? JSON.parse(local) : defaultPricesHistory;
      });

      const [orders, setOrders] = useState(() => {
        const local = localStorage.getItem('st_orders');
        return local ? JSON.parse(local) : defaultOrders;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const local = localStorage.getItem('st_current_user');
        return local ? JSON.parse(local) : null; // { name: '...', email: '...', role: 'customer'/'admin' }
      });

      useEffect(() => {
        localStorage.setItem('st_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('st_prices_history', JSON.stringify(pricesHistory));
      }, [pricesHistory]);

      useEffect(() => {
        localStorage.setItem('st_orders', JSON.stringify(orders));
      }, [orders]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('st_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('st_current_user');
        }
      }, [currentUser]);

      // Routing State: 'home' | 'catalog' | 'cart' | 'checkout' | 'tracking' | 'customer' | 'admin' | 'auth'
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedProductId, setSelectedProductId] = useState(null);
      const [trackingOrderId, setTrackingOrderId] = useState('');
      const [selectedOrderForInvoice, setSelectedOrderForInvoice] = useState(null);

      // Cart State
      const [cart, setCart] = useState(() => {
        const local = localStorage.getItem('st_cart');
        return local ? JSON.parse(local) : []; // { product, quantity }
      });

      useEffect(() => {
        localStorage.setItem('st_cart', JSON.stringify(cart));
      }, [cart]);

      // Notification State
      const [toasts, setToasts] = useState([]);
      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4000);
      };

      // Helper routing
      const navigate = (page) => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setCurrentPage(page);
      };

      // Log out handler
      const handleLogout = () => {
        setCurrentUser(null);
        setCart([]);
        addToast('Successfully logged out!');
        navigate('home');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-lightBg font-sans text-navy">
          
          {/* TOAST SYSTEM */}
          <div className="fixed top-24 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map((t) => (
              <div
                key={t.id}
                className={`px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-all duration-300 transform translate-x-0 pointer-events-auto border-l-4 ${
                  t.type === 'success'
                    ? 'bg-white border-teal text-navy'
                    : t.type === 'error'
                    ? 'bg-red-50 border-red-500 text-red-800'
                    : 'bg-yellow-50 border-gold text-yellow-900'
                }`}
              >
                {t.type === 'success' && <i className="fa-solid fa-circle-check text-teal"></i>}
                {t.type === 'error' && <i className="fa-solid fa-circle-exclamation text-red-500"></i>}
                {t.type === 'warning' && <i className="fa-solid fa-triangle-exclamation text-gold"></i>}
                <span className="text-sm font-semibold">{t.message}</span>
              </div>
            ))}
          </div>

          {/* DYNAMIC HEADER */}
          <Navbar 
            currentPage={currentPage} 
            navigate={navigate} 
            currentUser={currentUser} 
            handleLogout={handleLogout} 
            cartCount={cart.reduce((sum, item) => sum + item.quantity, 0)} 
          />

          {/* MAIN PAGE ROUTER */}
          <main className="flex-grow pt-20">
            {currentPage === 'home' && (
              <HomePage 
                navigate={navigate} 
                pricesHistory={pricesHistory} 
                products={products} 
                setSelectedProductId={(id) => { setSelectedProductId(id); navigate('catalog'); }} 
              />
            )}
            
            {currentPage === 'catalog' && (
              <CatalogPage 
                products={products} 
                selectedProductId={selectedProductId}
                setSelectedProductId={setSelectedProductId}
                cart={cart}
                setCart={setCart}
                addToast={addToast}
                navigate={navigate}
              />
            )}

            {currentPage === 'cart' && (
              <CartPage 
                cart={cart} 
                setCart={setCart} 
                navigate={navigate} 
                currentUser={currentUser} 
                addToast={addToast} 
              />
            )}

            {currentPage === 'checkout' && (
              <CheckoutPage 
                cart={cart} 
                setCart={setCart} 
                currentUser={currentUser} 
                orders={orders} 
                setOrders={setOrders} 
                products={products}
                setProducts={setProducts}
                navigate={navigate} 
                addToast={addToast}
                setSelectedOrderForInvoice={setSelectedOrderForInvoice}
              />
            )}

            {currentPage === 'tracking' && (
              <TrackingPage 
                orders={orders} 
                trackingOrderId={trackingOrderId}
                setTrackingOrderId={setTrackingOrderId}
              />
            )}

            {currentPage === 'customer' && (
              <CustomerDashboard 
                currentUser={currentUser} 
                orders={orders} 
                navigate={navigate}
                setTrackingOrderId={setTrackingOrderId}
                setSelectedOrderForInvoice={setSelectedOrderForInvoice}
              />
            )}

            {currentPage === 'admin' && (
              <AdminDashboard 
                products={products} 
                setProducts={setProducts} 
                orders={orders} 
                setOrders={setOrders}
                pricesHistory={pricesHistory}
                setPricesHistory={setPricesHistory}
                addToast={addToast}
                setSelectedOrderForInvoice={setSelectedOrderForInvoice}
                navigate={navigate}
              />
            )}

            {currentPage === 'auth' && (
              <AuthPage 
                setCurrentUser={setCurrentUser} 
                navigate={navigate} 
                addToast={addToast} 
              />
            )}
          </main>

          {/* DYNAMIC INVOICE PRINT MODAL */}
          {selectedOrderForInvoice && (
            <InvoiceModal 
              order={selectedOrderForInvoice} 
              onClose={() => setSelectedOrderForInvoice(null)} 
            />
          )}

          {/* FOOTER */}
          <Footer navigate={navigate} />

        </div>
      );
    }

    // --- COMPONENT: NAVBAR ---
    function Navbar({ currentPage, navigate, currentUser, handleLogout, cartCount }) {
      const [isOpen, setIsOpen] = useState(false);
      return (
        <header className="fixed top-0 left-0 w-full z-40 bg-navy text-white shadow-lg transition-all duration-300">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center h-20">
              {/* Brand Logo */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => navigate('home')}>
                <div className="bg-teal p-2.5 rounded-lg flex items-center justify-center shadow-glow border border-teal-light">
                  <i className="fa-solid fa-trowel-bricks text-xl text-white"></i>
                </div>
                <div>
                  <span className="font-display font-extrabold text-2xl tracking-tight text-white block">
                    SAI TEJA <span className="text-gold">TRADERS</span>
                  </span>
                  <span className="text-[10px] text-slate-400 font-semibold tracking-widest uppercase block -mt-1">
                    Steel & Cement B2B Hub
                  </span>
                </div>
              </div>

              {/* Desktop Nav Links */}
              <nav className="hidden md:flex items-center space-x-1 font-medium">
                <button 
                  onClick={() => navigate('home')} 
                  className={`px-3 py-2 rounded-md text-sm transition-colors ${currentPage === 'home' ? 'text-gold' : 'hover:text-teal'}`}
                >
                  Home
                </button>
                <button 
                  onClick={() => navigate('catalog')} 
                  className={`px-3 py-2 rounded-md text-sm transition-colors ${currentPage === 'catalog' ? 'text-gold' : 'hover:text-teal'}`}
                >
                  Catalogue
                </button>
                <button 
                  onClick={() => navigate('tracking')} 
                  className={`px-3 py-2 rounded-md text-sm transition-colors ${currentPage === 'tracking' ? 'text-gold' : 'hover:text-teal'}`}
                >
                  Track Order
                </button>
                
                {currentUser && currentUser.role === 'customer' && (
                  <button 
                    onClick={() => navigate('customer')} 
                    className={`px-3 py-2 rounded-md text-sm transition-colors ${currentPage === 'customer' ? 'text-gold' : 'hover:text-teal'}`}
                  >
                    My Dashboard
                  </button>
                )}

                {currentUser && currentUser.role === 'admin' && (
                  <button 
                    onClick={() => navigate('admin')} 
                    className={`px-3 py-2 rounded-md text-sm font-semibold text-gold border border-gold/30 bg-gold/10 px-4 py-1.5 rounded-md hover:bg-gold hover:text-navy transition-all duration-300 ${currentPage === 'admin' ? 'bg-gold text-navy' : ''}`}
                  >
                    <i className="fa-solid fa-lock-open mr-1.5"></i>Admin Console
                  </button>
                )}
              </nav>

              {/* User Account Controls / Cart */}
              <div className="hidden md:flex items-center space-x-4">
                {/* Cart Icon */}
                <button 
                  onClick={() => navigate('cart')} 
                  className="relative p-2.5 rounded-full hover:bg-navy-light text-white transition-colors"
                >
                  <i className="fa-solid fa-cart-shopping text-lg"></i>
                  {cartCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-teal text-white text-[11px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-navy">
                      {cartCount}
                    </span>
                  )}
                </button>

                {currentUser ? (
                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <span className="text-sm font-semibold block text-slate-100">{currentUser.name}</span>
                      <span className="text-[10px] text-slate-400 capitalize block -mt-1">{currentUser.role}</span>
                    </div>
                    <button 
                      onClick={handleLogout} 
                      className="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-sign-out-alt"></i>Logout
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => navigate('auth')} 
                    className="bg-teal hover:bg-teal-dark text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-glow hover:shadow-lg transition-all duration-300"
                  >
                    <i className="fa-solid fa-user mr-1.5"></i>Login / Sign Up
                  </button>
                )}
              </div>

              {/* Mobile hamburger button */}
              <div className="md:hidden flex items-center gap-3">
                <button 
                  onClick={() => navigate('cart')} 
                  className="relative p-2 text-white"
                >
                  <i className="fa-solid fa-cart-shopping text-lg"></i>
                  {cartCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-teal text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                      {cartCount}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => setIsOpen(!isOpen)}
                  className="text-white p-2 rounded-md hover:bg-navy-light focus:outline-none"
                >
                  <i className={`fa-solid ${isOpen ? 'fa-xmark' : 'fa-bars'} text-xl`}></i>
                </button>
              </div>
            </div>
          </div>

          {/* Mobile Menu */}
          {isOpen && (
            <div className="md:hidden bg-navy-dark border-t border-navy-light px-4 pt-2 pb-6 space-y-2">
              <button 
                onClick={() => { navigate('home'); setIsOpen(false); }} 
                className="w-full text-left px-3 py-2 rounded-md text-sm font-medium hover:bg-navy-light"
              >
                Home
              </button>
              <button 
                onClick={() => { navigate('catalog'); setIsOpen(false); }} 
                className="w-full text-left px-3 py-2 rounded-md text-sm font-medium hover:bg-navy-light"
              >
                Catalogue
              </button>
              <button 
                onClick={() => { navigate('tracking'); setIsOpen(false); }} 
                className="w-full text-left px-3 py-2 rounded-md text-sm font-medium hover:bg-navy-light"
              >
                Track Order
              </button>
              
              {currentUser && currentUser.role === 'customer' && (
                <button 
                  onClick={() => { navigate('customer'); setIsOpen(false); }} 
                  className="w-full text-left px-3 py-2 rounded-md text-sm font-medium hover:bg-navy-light"
                >
                  My Dashboard
                </button>
              )}
              {currentUser && currentUser.role === 'admin' && (
                <button 
                  onClick={() => { navigate('admin'); setIsOpen(false); }} 
                  className="w-full text-left px-3 py-2 rounded-md text-sm font-medium text-gold hover:bg-navy-light"
                >
                  Admin Console
                </button>
              )}

              <hr className="border-navy-light my-3" />
              
              {currentUser ? (
                <div className="flex flex-col gap-2">
                  <div className="px-3">
                    <span className="text-sm font-bold block text-white">{currentUser.name}</span>
                    <span className="text-xs text-slate-400 capitalize block">{currentUser.role}</span>
                  </div>
                  <button 
                    onClick={() => { handleLogout(); setIsOpen(false); }} 
                    className="w-full bg-red-600 hover:bg-red-700 text-white font-semibold text-sm py-2 px-3 rounded-md text-center transition-colors"
                  >
                    Logout
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => { navigate('auth'); setIsOpen(false); }} 
                  className="w-full bg-teal text-white font-semibold text-sm py-2.5 px-3 rounded-md text-center transition-colors shadow-glow"
                >
                  Login / Sign Up
                </button>
              )}
            </div>
          )}
        </header>
      );
    }

    // --- COMPONENT: FOOTER ---
    function Footer({ navigate }) {
      return (
        <footer className="bg-navy text-slate-300 border-t-4 border-teal pt-16 pb-8">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-8">
            <div className="md:col-span-2">
              <div className="flex items-center gap-3 mb-4">
                <div className="bg-teal p-2 rounded-lg text-white">
                  <i className="fa-solid fa-trowel-bricks text-lg"></i>
                </div>
                <span className="font-display font-extrabold text-xl tracking-tight text-white">
                  SAI TEJA <span className="text-gold">TRADERS</span>
                </span>
              </div>
              <p className="text-sm text-slate-400 leading-relaxed mb-4 max-w-sm">
                Sai Teja Traders is India's leading digital platform supplying premium quality TMT steel bars, binding wire, and cement products directly to B2B building contractors, infrastructure developers, and builders.
              </p>
              <div className="flex gap-4">
                <a href="#" className="p-2 rounded-full bg-navy-light text-slate-400 hover:text-teal hover:bg-white transition-all"><i className="fa-brands fa-facebook-f"></i></a>
                <a href="#" className="p-2 rounded-full bg-navy-light text-slate-400 hover:text-teal hover:bg-white transition-all"><i className="fa-brands fa-linkedin-in"></i></a>
                <a href="#" className="p-2 rounded-full bg-navy-light text-slate-400 hover:text-teal hover:bg-white transition-all"><i className="fa-brands fa-twitter"></i></a>
              </div>
            </div>

            <div>
              <h3 className="font-display text-white font-bold text-sm uppercase tracking-wider mb-4">Product Catalog</h3>
              <ul className="space-y-2.5 text-sm font-medium">
                <li><button onClick={() => navigate('catalog')} className="hover:text-teal transition-colors">Steel TMT Rebars</button></li>
                <li><button onClick={() => navigate('catalog')} className="hover:text-teal transition-colors">OPC & PPC Cements</button></li>
                <li><button onClick={() => navigate('catalog')} className="hover:text-teal transition-colors">Binding Galvanized Wire</button></li>
                <li><button onClick={() => navigate('catalog')} className="hover:text-teal transition-colors">Construction Spacer Blocks</button></li>
              </ul>
            </div>

            <div>
              <h3 className="font-display text-white font-bold text-sm uppercase tracking-wider mb-4">Contact Support</h3>
              <ul className="space-y-3 text-sm">
                <li className="flex items-start gap-2.5">
                  <i className="fa-solid fa-location-dot text-teal mt-1"></i>
                  <span className="text-slate-400 text-xs">D-No 12-42, Industrial Area, Jeedimetla, Hyderabad, Telangana, 500055</span>

    // --- COMPONENT: CATALOGUE PAGE ---
    function CatalogPage({ products, selectedProductId, setSelectedProductId, cart, setCart, addToast, navigate }) {
      const [search, setSearch] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedBrand, setSelectedBrand] = useState('All');
      const [sortBy, setSortBy] = useState('name-asc');

      // Unique brands & categories
      const categories = useMemo(() => ['All', ...new Set(products.map((p) => p.category))], [products]);
      const brands = useMemo(() => ['All', ...new Set(products.map((p) => p.brand))], [products]);

      // Handle query selection for details modal
      const selectedProduct = useMemo(() => {
        if (!selectedProductId) return null;
        return products.find((p) => p.id === selectedProductId);
      }, [selectedProductId, products]);

      // Filtering logic
      const filteredProducts = useMemo(() => {
        return products.filter((p) => {
          const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || 
                              p.brand.toLowerCase().includes(search.toLowerCase()) ||
                              p.grade.toLowerCase().includes(search.toLowerCase());
          const matchCat = selectedCategory === 'All' || p.category === selectedCategory;
          const matchBrand = selectedBrand === 'All' || p.brand === selectedBrand;
          return matchSearch && matchCat && matchBrand;
        }).sort((a, b) => {
          if (sortBy === 'price-asc') return a.price - b.price;
          if (sortBy === 'price-desc') return b.price - a.price;
          if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
          return b.name.localeCompare(a.name);
        });
      }, [products, search, selectedCategory, selectedBrand, sortBy]);

      // Add to cart handler
      const handleAddToCart = (product, quantity = 1) => {
        if (product.stock <= 0) {
          addToast('Product is currently out of stock!', 'error');
          return;
        }
        if (quantity > product.stock) {
          addToast(`Only ${product.stock} ${product.unit} available in stock!`, 'warning');
          return;
        }

        setCart((prev) => {
          const existing = prev.find((item) => item.product.id === product.id);
          if (existing) {
            return prev.map((item) => 
              item.product.id === product.id 
                ? { ...item, quantity: item.quantity + quantity }
                : item
            );
          }
          return [...prev, { product, quantity }];
        });
        addToast(`Added ${quantity} ${product.unit} of ${product.name} to Cart.`);

            {/* Category Filter */}

              >
                <option value="" disabled>Category</option>
                {categories.map((c) => (
                  <option key={c} value={c}>{c === 'All' ? 'All Categories' : c}</option>

              </select>
            </div>

            {/* Brand Filter */}

              <select
                value={selectedBrand}
                onChange={(e) => setSelectedBrand(e.target.value)}

              >
                <option value="" disabled>Brand</option>
                {brands.map((b) => (
                  <option key={b} value={b}>{b === 'All' ? 'All Brands' : b}</option>

              </select>
            </div>

            {/* Sort Dropdown */}
            <div>
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}

              >
                <option value="name-asc">Sort: A to Z</option>
                <option value="name-desc">Sort: Z to A</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>

          </div>

          {/* CATALOGUE GRID */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {filteredProducts.length > 0 ? (
              filteredProducts.map((p) => {
                const isLowStock = p.stock <= p.lowStock;
                return (
                  <div key={p.id} className="bg-white rounded-2xl overflow-hidden shadow-premium border border-slate-100 hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
                    <div>

                      <div className="p-5">

                      <div className="flex justify-between items-baseline mb-2">

                        <span className="font-display font-extrabold text-navy text-lg">

                        </span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setSelectedProductId(p.id)}
                          className="bg-slate-200 hover:bg-slate-35 text-navy font-semibold text-xs py-2 px-3 rounded-lg transition-colors text-center"
                        >
                          Specs
                        </button>
                        <button
                          onClick={() => handleAddToCart(p, 1)}
                          disabled={p.stock <= 0}
                          className={`text-white font-bold text-xs py-2 px-3 rounded-lg transition-colors flex items-center justify-center gap-1.5 ${
                            p.stock > 0 ? 'bg-teal hover:bg-teal-dark shadow-glow' : 'bg-slate-300 cursor-not-allowed'
                          }`}
                        >
                          <i className="fa-solid fa-cart-plus"></i>Add
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })
            ) : (
              <div className="col-span-full bg-white rounded-2xl p-12 text-center border border-slate-100">
                <i className="fa-solid fa-magnifying-glass-minus text-4xl text-slate-300 mb-4"></i>
                <h4 className="font-display font-bold text-lg text-navy mb-1">No Materials Found</h4>
                <p className="text-slate-500 text-sm">Adjust search terms or reset category and brand filters.</p>
              </div>
            )}
          </div>

          {/* DYNAMIC COMPONENT: PRODUCT DETAILS MODAL */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full shadow-premium border border-slate-100 overflow-hidden relative">
                <button 
                  onClick={() => setSelectedProductId(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-navy text-lg p-2 transition-colors z-10"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>
                <div className="md:flex">
                  <div className="md:w-1/2 p-6 bg-slate-50 flex items-center justify-center">
                    <div className="w-56 h-56">
                      <ProductImage type={selectedProduct.image} />
                    </div>
                  </div>
                  <div className="md:w-1/2 p-6 flex flex-col justify-between">
                    <div>
                      <div className="flex gap-2 mb-2">
                        <span className="bg-teal/15 text-teal text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">{selectedProduct.category}</span>
                        <span className="bg-slate-100 text-navy text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">{selectedProduct.brand}</span>
                      </div>
                      <h2 className="font-display font-bold text-xl text-navy mb-2">{selectedProduct.name}</h2>
                      <p className="text-xs text-slate-500 leading-relaxed mb-4">{selectedProduct.spec}</p>
                      
                      <div className="grid grid-cols-2 gap-4 mb-4 border-y border-slate-100 py-3 text-xs">
                        <div>
                          <span className="text-slate-400 block uppercase font-semibold">Grade</span>
                          <span className="font-semibold text-navy">{selectedProduct.grade}</span>
                        </div>
                        <div>
                          <span className="text-slate-400 block uppercase font-semibold">Availability</span>
                          <span className={`font-semibold ${selectedProduct.stock > selectedProduct.lowStock ? 'text-green-600' : 'text-yellow-600'}`}>
                            {selectedProduct.stock.toLocaleString('en-IN')} {selectedProduct.unit}s
                          </span>
                        </div>
                        <div>
                          <span className="text-slate-400 block uppercase font-semibold">Live Base Price</span>
                          <span className="font-display font-extrabold text-teal">₹{selectedProduct.price.toLocaleString('en-IN')}/{selectedProduct.unit}</span>
                        </div>
                        <div>
                          <span className="text-slate-400 block uppercase font-semibold">Logistics Estimate</span>
                          <span className="font-semibold text-navy">24 - 48 Hours Dispatch</span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-3">
                      <div className="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                        <button 
                          onClick={() => {

                            if (val > 1) document.getElementById('qty-input').value = parseInt(val) - 1;

    // --- COMPONENT: SHOPPING CART ---
    function CartPage({ cart, setCart, navigate, currentUser, addToast }) {
      const subtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
      }, [cart]);

      // standard B2B construction materials GST in India is 18%
      const gst = useMemo(() => Math.round(subtotal * 0.18), [subtotal]);
      const total = useMemo(() => subtotal + gst, [subtotal, gst]);

      // State for delivery scheduling (minimum 2 days ahead)
      const minDate = useMemo(() => {
        const d = new Date();
        d.setDate(d.getDate() + 2);
        return d.toISOString().split('T')[0];
      }, []);

      const [deliveryDate, setDeliveryDate] = useState(minDate);

      // Handle item quantity updates
      const updateQty = (id, change) => {
        setCart((prev) => 
          prev.map((item) => {
            if (item.product.id === id) {
              const newQty = item.quantity + change;
              if (newQty <= 0) return null;
              if (newQty > item.product.stock) {
                addToast(`Only ${item.product.stock} ${item.product.unit}s available in warehouse!`, 'warning');
                return item;
              }
              return { ...item, quantity: newQty };
            }
            return item;
          }).filter(Boolean)
        );
      };

      // Handle checkout click
      const handleCheckout = () => {
        if (!currentUser) {
          addToast('Please login or register to complete checkout.', 'warning');
          navigate('auth');
          return;
        }
        localStorage.setItem('st_scheduled_delivery', deliveryDate);
        navigate('checkout');
      };

      return (
        <section className="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="mb-8">
            <h1 className="text-3xl font-display font-extrabold text-navy">Shopping Cart</h1>
            <p className="text-slate-500 text-sm mt-1">Review scheduled logistics and price calculation summaries.</p>
          </div>

          {cart.length > 0 ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              {/* CART LIST */}
              <div className="lg:col-span-2 space-y-4">
                {cart.map((item) => (
                  <div key={item.product.id} className="bg-white rounded-2xl p-5 shadow-premium border border-slate-100 flex items-center justify-between gap-4">
                    <div className="w-16 h-16 flex-shrink-0 bg-slate-50 flex items-center justify-center p-2 rounded-lg">
                      <ProductImage type={item.product.image} />
                    </div>
                    
                    <div className="flex-grow">
                      <span className="text-[10px] bg-slate-100 text-navy font-bold px-2 py-0.5 rounded uppercase">{item.product.brand}</span>
                      <h3 className="font-display font-bold text-sm text-navy mt-1">{item.product.name}</h3>
                      <span className="text-xs text-slate-400 block mt-0.5">Base Price: ₹{item.product.price.toLocaleString('en-IN')}/{item.product.unit}</span>
                    </div>

                    {/* Quantity Selector */}
                    <div className="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50 flex-shrink-0">
                      <button 
                        onClick={() => updateQty(item.product.id, -1)}
                        className="px-2.5 py-1 text-slate-500 hover:bg-slate-200 transition-colors"
                      >
                        -
                      </button>
                      <span className="w-10 text-center text-xs font-bold text-navy">{item.quantity}</span>
                      <button 
                        onClick={() => updateQty(item.product.id, 1)}
                        className="px-2.5 py-1 text-slate-500 hover:bg-slate-200 transition-colors"
                      >
                        +
                      </button>
                    </div>

                    {/* Subtotal */}
                    <div className="text-right flex-shrink-0 min-w-[100px]">
                      <span className="text-[10px] text-slate-400 block">Subtotal</span>
                      <span className="font-display font-bold text-sm text-navy">
                        ₹{(item.product.price * item.quantity).toLocaleString('en-IN')}
                      </span>
                    </div>

                    {/* Remove */}
                    <button 
                      onClick={() => updateQty(item.product.id, -item.quantity)}
                      className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors flex-shrink-0"
                    >
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  </div>
                ))}

                {/* Back button */}
                <button 
                  onClick={() => navigate('catalog')}
                  className="text-teal font-semibold text-sm hover:text-teal-dark flex items-center gap-1.5 transition-colors"
                >
                  <i className="fa-solid fa-arrow-left-long"></i> Add More Materials
                </button>
              </div>

              {/* SUMMARY & SCHEDULING CARD */}
              <div className="bg-white rounded-2xl p-6 shadow-premium border border-slate-100 h-fit space-y-6">
                <div>
                  <h3 className="font-display font-bold text-base text-navy border-b border-slate-100 pb-3 mb-4 flex items-center gap-2">
                    <i className="fa-solid fa-truck-ramp-box text-teal"></i> Delivery Scheduling
                  </h3>
                  <label className="text-xs text-slate-400 font-semibold uppercase block mb-1.5">Preferred Delivery Date</label>
                  <input 
                    type="date" 
                    min={minDate}
                    value={deliveryDate}
                    onChange={(e) => setDeliveryDate(e.target.value)}
                    className="w-full bg-slate-50 rounded-xl px-4 py-3 text-sm text-navy focus:outline-none focus:ring-2 focus:ring-teal border border-slate-100 font-medium"
                  />
                  <p className="text-[10px] text-slate-400 mt-2">
                    *Logistics scheduling must be booked at least 48 hours in advance to organize secure flatbed heavy trucks.
                  </p>
                </div>

                <hr className="border-slate-100" />

                <div>
                  <h3 className="font-display font-bold text-base text-navy mb-4">Invoice Calculation Summary</h3>
                  <div className="space-y-2.5 text-sm">
                    <div className="flex justify-between text-slate-500">
                      <span>Materials Net Subtotal</span>
                      <span className="font-semibold text-navy">₹{subtotal.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-slate-500">
                      <span>GST (18% B2B)</span>
                      <span className="font-semibold text-navy">₹{gst.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-slate-500">
                      <span>Logistics Transport Charge</span>
                      <span className="font-semibold text-green-600">FREE</span>
                    </div>
                    <hr className="border-slate-100 my-2" />
                    <div className="flex justify-between text-base font-display font-extrabold text-navy">
                      <span>Grand Total (incl. tax)</span>
                      <span className="text-teal">₹{total.toLocaleString('en-IN')}</span>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={handleCheckout}
                  className="w-full bg-teal hover:bg-teal-dark text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-glow text-center text-sm"
                >
                  Proceed to Checkout <i className="fa-solid fa-arrow-right-long ml-1"></i>
                </button>
              </div>

            </div>
          ) : (
            <div className="bg-white rounded-2xl p-16 text-center border border-slate-100 max-w-lg mx-auto">
              <i className="fa-solid fa-cart-flatbed text-5xl text-slate-300 mb-4"></i>
              <h4 className="font-display font-bold text-lg text-navy mb-1">Your Shopping Cart is Empty</h4>
              <p className="text-slate-500 text-sm mb-6">Select construction rebars or concrete cement bags first.</p>
              <button 
                onClick={() => navigate('catalog')}
                className="bg-navy hover:bg-navy-light text-white font-bold px-6 py-3 rounded-xl transition-colors inline-block text-sm"
              >
                Go to Catalogue
              </button>
            </div>
          )}

        </section>
      );
    }

    // --- COMPONENT: CHECKOUT PAGE ---
    function CheckoutPage({ cart, setCart, currentUser, orders, setOrders, products, setProducts, navigate, addToast, setSelectedOrderForInvoice }) {
      const scheduledDate = localStorage.getItem('st_scheduled_delivery') || '';
      
      const subtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0), [cart]);
      const gst = useMemo(() => Math.round(subtotal * 0.18), [subtotal]);
      const total = useMemo(() => subtotal + gst, [subtotal]);

      // Form State
      const [name, setName] = useState(currentUser?.name || '');
      const [mobile, setMobile] = useState(currentUser?.mobile || '');
      const [gstin, setGstin] = useState(currentUser?.gstin || '');
      const [address, setAddress] = useState(currentUser?.address || '');

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) {
          addToast('Cart is empty!', 'error');
          navigate('catalog');
          return;
        }

        const orderId = 'ORD-' + Math.floor(10000 + Math.random() * 90000);
        
        const newOrder = {
          id: orderId,
          customerName: name,
          customerMobile: mobile,
          customerGST: gstin || 'N/A',
          deliveryAddress: address,
          date: new Date().toISOString().split('T')[0],
          deliveryDate: scheduledDate,
          items: cart.map(item => ({
            productId: item.product.id,
            name: item.product.name,
            quantity: item.quantity,
            price: item.product.price,
            unit: item.product.unit
          })),
          subtotal,
          gst,
          total,
          paymentMethod: 'WhatsApp',
          paymentStatus: 'Pending',
          deliveryStatus: 'Order Confirmed',
          trackingHistory: [
            { 
              status: 'Order Confirmed', 
              time: new Date().toLocaleDateString('en-US') + ' ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }), 
              comment: `Order confirmed. Complete details shared via WhatsApp.` 
            }
          ]
        };

        // Subtract stock quantities
        const updatedProducts = products.map((p) => {
          const cartItem = cart.find((item) => item.product.id === p.id);
          if (cartItem) {
            return { ...p, stock: Math.max(0, p.stock - cartItem.quantity) };
          }
          return p;
        });

        // Format items list for WhatsApp message
        const itemsText = cart.map(item => 
          `• ${item.product.name} (${item.quantity} ${item.product.unit}s x ₹${item.product.price.toLocaleString('en-IN')}) = ₹${(item.product.price * item.quantity).toLocaleString('en-IN')}`
        ).join('\n');

        // Create WhatsApp message
        const message = `Hello Sai Teja Traders! I would like to place a bulk order.

*Order Details:*
• *Order ID:* ${orderId}
• *Authorized Name:* ${name}
• *Mobile Contact:* ${mobile}
• *GSTIN:* ${gstin || 'N/A'}
• *Site Delivery Address:* ${address}
• *Scheduled Delivery Date:* ${scheduledDate || 'None Selected'}

    function TrackingPage({ orders, trackingOrderId, setTrackingOrderId }) {
      const [searchQuery, setSearchQuery] = useState(trackingOrderId || '');

      const [searched, setSearched] = useState(false);

      useEffect(() => {
        if (trackingOrderId) {
          const ord = orders.find((o) => o.id === trackingOrderId);
          setMatchedOrder(ord || null);
          setSearched(true);
        }
      }, [trackingOrderId, orders]);

      const handleSearch = (e) => {
        e.preventDefault();
        setSearched(true);
        const ord = orders.find((o) => o.id.toUpperCase() === searchQuery.trim().toUpperCase());
        setMatchedOrder(ord || null);
        if (ord) {
          setTrackingOrderId(ord.id);
        }
      };

      const steps = ['Order Confirmed', 'Processing', 'Dispatched', 'Out for Delivery', 'Delivered'];
      
      const currentStepIdx = matchedOrder 
        ? steps.indexOf(matchedOrder.deliveryStatus)

      return (

              </div>

              {/* TIMELINE */}

                <h3 className="font-display font-bold text-base text-navy border-b border-slate-100 pb-3 mb-6">Dispatch Milestones</h3>
                
                <div className="relative pl-8 border-l-2 border-slate-200 ml-3.5 space-y-8">
                  {steps.map((step, idx) => {
                    const isDone = idx <= currentStepIdx;

                      <div key={step} className="relative">

    function AdminDashboard({ products, setProducts, orders, setOrders, pricesHistory, setPricesHistory, addToast, setSelectedOrderForInvoice, navigate }) {
      const [activeTab, setActiveTab] = useState('orders'); // 'orders' | 'inventory' | 'prices' | 'analytics'
      const [newPriceValue, setNewPriceValue] = useState('');
      const [selectedPriceCat, setSelectedPriceCat] = useState('Steel TMT Bars');

      // Admin stats
      const totalSales = useMemo(() => orders.reduce((sum, o) => sum + o.total, 0), [orders]);
      const revenue = useMemo(() => orders.reduce((sum, o) => sum + o.subtotal, 0), [orders]);
      const lowStockAlerts = useMemo(() => products.filter(p => p.stock <= p.lowStock).length, [products]);

      // Handle price updates
      const handleUpdatePrice = (e) => {
        e.preventDefault();
        const price = parseInt(newPriceValue);
        if (!price || price <= 0) {
          addToast('Please enter a valid price!', 'error');
          return;
        }

        // Update price history
        const updatedHistory = pricesHistory.map((item) => {
          if (item.category === selectedPriceCat) {
            return {
              ...item,
              previousPrice: item.currentPrice,
              currentPrice: price,
              lastUpdated: 'Just Now'
            };
          }
          return item;
        });

        // Update product prices in that category
        const updatedProducts = products.map((prod) => {
          if (prod.category === selectedPriceCat) {
            // For steel TMT / Binding wire, update base tons. For Cement, let's update proportional cement bag prices.
            // Tata rebar vs JSW rebar are different, so let's adjust by percentage change or set directly
            const oldCatPrice = pricesHistory.find(i => i.category === selectedPriceCat).currentPrice;
            const multiplier = price / oldCatPrice;
            return {
              ...prod,
              price: Math.round(prod.price * multiplier)
            };
          }
          return prod;
        });

        setPricesHistory(updatedHistory);
        setProducts(updatedProducts);
        setNewPriceValue('');
        addToast(`Base prices for ${selectedPriceCat} updated successfully system-wide.`);
      };

      // Handle order status change
      const handleOrderStatusChange = (orderId, newStatus) => {
        const commentForStep = {
          'Order Confirmed': 'Order confirmed via selected payment gateway.',
          'Processing': 'Materials allocated and packed at logistics yard.',
          'Dispatched': 'Flatbed heavy truck left Jeedimetla logistics warehouse.',
          'Out for Delivery': 'Vehicle arrived at customer local delivery perimeter.',
          'Delivered': 'Shipment unloaded. Digital proof of delivery receipt registered.'
        };

        const updatedOrders = orders.map((o) => {
          if (o.id === orderId) {
            // Check if step already exists in trackingHistory
            const exists = o.trackingHistory.some((h) => h.status === newStatus);
            let updatedHistory = [...o.trackingHistory];
            if (!exists) {
              updatedHistory.push({
                status: newStatus,
                time: new Date().toLocaleDateString('en-US') + ' ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                comment: commentForStep[newStatus] || 'Status changed by Admin.'
              });
            }
            return {
              ...o,
              deliveryStatus: newStatus,
              trackingHistory: updatedHistory
            };
          }
          return o;
        });

        setOrders(updatedOrders);
        addToast(`Order ${orderId} status changed to ${newStatus}.`);
      };

      // Handle inventory stock addition
      const handleAddStock = (prodId, amt) => {
        const val = parseInt(amt);
        if (!val || val <= 0) return;
        const updated = products.map((p) => {
          if (p.id === prodId) {
            return { ...p, stock: p.stock + val };
          }
          return p;
        });
        setProducts(updated);
        addToast(`Added ${val} units of stock.`);
      };

      return (
        <section className="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="mb-8">
            <h1 className="text-3xl font-display font-extrabold text-navy">Admin Management Console</h1>

          </div>

          {/* DASHBOARD ANALYTICS PANEL */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

              <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Total Sales (incl. GST)</span>
              <span className="font-display font-black text-2xl text-navy block mt-1">₹{totalSales.toLocaleString('en-IN')}</span>
              <span className="text-xs text-green-600 font-bold block mt-1"><i className="fa-solid fa-chevron-up"></i> +12% vs last week</span>
            </div>
            
            <div className="bg-white rounded-2xl p-6 shadow-premium border border-slate-100">
              <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">Material Net Revenue</span>
              <span className="font-display font-black text-2xl text-navy block mt-1">₹{revenue.toLocaleString('en-IN')}</span>
              <span className="text-xs text-slate-450 block mt-1">Excl. 18% dynamic GST</span>

                  </tbody>
                </table>
              </div>

              {/* Totals */}
              <div className="border-t border-slate-200 pt-6 flex justify-end">
                <div className="w-64 space-y-2 text-slate-500 font-semibold text-right">
                  <div className="flex justify-between">
                    <span>Taxable Value (Subtotal):</span>
                    <span className="text-navy">₹{order.subtotal.toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Integrated GST (18%):</span>
                    <span className="text-navy">₹{order.gst.toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Logistics Flat Transport:</span>
                    <span className="text-green-600 font-bold">FREE</span>
                  </div>
                  <hr className="border-slate-200 my-1" />
                  <div className="flex justify-between text-sm font-display font-extrabold text-navy">
                    <span>Total Tax-Paid Bill:</span>
                    <span className="text-teal text-base">₹{order.total.toLocaleString('en-IN')}</span>
                  </div>
                </div>
              </div>

              {/* Invoice footer sign */}
              <div className="flex justify-between items-end border-t border-slate-100 pt-8 text-[9px] text-slate-400">
                <div>
                  <p>Payment Mode: <strong>{order.paymentMethod}</strong></p>
                  <p>Payment Status: <strong>{order.paymentStatus}</strong></p>
                </div>
                <div className="text-center">
                  <div className="w-28 border-b border-slate-300 mx-auto mb-1"></div>
                  <span>Authorized Signature</span>
                  <p className="font-bold text-navy mt-0.5">Sai Teja Traders Finance</p>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // --- INITIAL RENDER ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
